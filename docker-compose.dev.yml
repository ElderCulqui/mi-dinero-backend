services:
  api:
    image: node:22-alpine
    container_name: mi_dinero_api_dev
    working_dir: /app
    volumes:
      - .:/app:rw
    env_file: .env
    ports:
      - "3100:3000"
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    networks:
      - local_network

networks:
  local_network:
    external: true
    name: local_network
