services:
  api:
    build: .
    image: mi-dinero-api:prod
    container_name: mi_dinero_api
    env_file: .env
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - local_network

networks:
  local_network:
    external: true
    name: local_network
